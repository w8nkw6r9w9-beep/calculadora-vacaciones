<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Vacaciones Proporcionales (Chile)</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --border: #cbd5e1;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 20px;
      margin: 0;
    }

    .container {
      background: var(--card);
      width: 100%;
      max-width: 520px;
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      border: 1px solid var(--border);
    }

    h2 {
      margin-top: 0;
      color: #0f172a;
      font-size: 1.3rem;
      text-align: center;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 1rem;
    }

    button {
      width: 100%;
      background-color: var(--primary);
      color: white;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #1d4ed8;
    }

    .results {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 2px dashed var(--border);
    }

    .card-detail {
      background: #f1f5f9;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .card-detail p {
      margin: 4px 0;
      font-size: 0.9rem;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }

    .total {
      font-weight: bold;
      font-size: 1.2rem;
      color: #16a34a;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 2px solid #16a34a;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Calculadora Vacaciones Proporcionales</h2>
  
  <div class="form-group">
    <label for="fInicio">Fecha de Ingreso de Trabajo</label>
    <input type="date" id="fInicio" required>
  </div>

  <div class="form-group">
    <label for="fTermino">Fecha de Finiquito / Desvinculación</label>
    <input type="date" id="fTermino" required>
  </div>

  <div class="form-group">
    <label for="sueldo">Sueldo Base o Promedio ($)</label>
    <input type="number" id="sueldo" placeholder="Ej: 600000" min="0" required>
  </div>

  <button onclick="calcularFiniquito()">Calcular Vacaciones Proporcionales</button>

  <div class="results" id="resultados" style="display:none;">
    
    <div class="card-detail">
      <p>⏱️ <strong>Tiempo Trabajado:</strong> <span id="antiguedadText"></span></p>
      <p>📅 <strong>Periodo Proporcional:</strong> <span id="periodoText"></span></p>
    </div>

    <div class="result-row">
      <span>Días Hábiles Acumulados:</span>
      <strong id="diasHabiles">0</strong>
    </div>

    <div class="result-row">
      <span>Días Inhábiles (Fines de semana/Festivos):</span>
      <strong id="diasInhabiles">0</strong>
    </div>

    <div class="result-row">
      <span><strong>Total Días Corridos a Pagar:</strong></span>
      <strong id="diasCorridos">0</strong>
    </div>

    <div class="result-row" style="margin-top: 8px;">
      <span>Monto Diario (Sueldo / 30):</span>
      <strong id="montoDiario">$0</strong>
    </div>

    <div class="result-row total">
      <span>Total Feriado Proporcional:</span>
      <strong id="montoTotal">$0</strong>
    </div>
  </div>
</div>

<script>
  const feriadosChile = [
    "2024-01-01", "2024-03-29", "2024-05-01", "2024-05-21", "2024-06-20", 
    "2024-07-16", "2024-08-15", "2024-09-18", "2024-09-19", "2024-09-20", 
    "2024-10-31", "2024-11-01", "2024-12-25",
    "2025-01-01", "2025-04-18", "2025-05-01", "2025-05-21", "2025-06-20", 
    "2025-07-16", "2025-08-15", "2025-09-18", "2025-09-19", "2025-10-31", 
    "2025-12-08", "2025-12-25",
    "2026-01-01", "2026-04-03", "2026-05-01", "2026-05-21", "2026-06-29", 
    "2026-07-16", "2026-09-18", "2026-10-12", "2026-12-08", "2026-12-25"
  ];

  function esFeriado(fechaStr) {
    return feriadosChile.includes(fechaStr);
  }

  function redondearExcel(val, dec = 2) {
    return Number(Math.round(val + 'e' + dec) + 'e-' + dec);
  }

  function calcularFiniquito() {
    const inicioStr = document.getElementById('fInicio').value;
    const terminoStr = document.getElementById('fTermino').value;
    const sueldo = parseFloat(document.getElementById('sueldo').value);

    if (!inicioStr || !terminoStr || isNaN(sueldo) || sueldo <= 0) {
      alert("Por favor completa todos los campos correctamente.");
      return;
    }

    const inicio = new Date(inicioStr + 'T00:00:00');
    const termino = new Date(terminoStr + 'T00:00:00');

    if (termino < inicio) {
      alert("La fecha de término no puede ser anterior a la de inicio.");
      return;
    }

    let y1 = inicio.getFullYear(), m1 = inicio.getMonth(), d1 = inicio.getDate();
    let y2 = termino.getFullYear(), m2 = termino.getMonth(), d2 = termino.getDate();

    let anios = y2 - y1;
    let meses = m2 - m1;
    let dias = d2 - d1 + 1;

    if (dias < 0) {
      meses--;
      dias += 30;
    }
    if (meses < 0) {
      anios--;
      meses += 12;
    }

    const mesesTotales = meses + (anios * 12);
    const diasHabilesSinRedondear = (1.25 * mesesTotales) + ((1.25 / 30) * dias);
    const diasHabilesAcc = redondearExcel(diasHabilesSinRedondear, 2);

    let fechaAux = new Date(termino);
    fechaAux.setDate(fechaAux.getDate() + 1);

    let habilesContados = 0;
    
    while (habilesContados < diasHabilesAcc) {
      const diaSemana = fechaAux.getDay();
      const fechaIso = fechaAux.toISOString().split('T')[0];

      if (diaSemana !== 0 && diaSemana !== 6 && !esFeriado(fechaIso)) {
        if (diasHabilesAcc - habilesContados < 1) {
          habilesContados = diasHabilesAcc;
          break;
        } else {
          habilesContados += 1;
        }
      }
      fechaAux.setDate(fechaAux.getDate() + 1);
    }

    const diffTime = Math.abs(fechaAux - termino);
    let diasCorridosBrutos = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
    
    const fraccionDiasCorridos = (diasCorridosBrutos - 1) + (diasHabilesAcc % 1);
    const diasInhabiles = fraccionDiasCorridos - diasHabilesAcc;

    const valorDiario = sueldo / 30;
    const totalPagar = fraccionDiasCorridos * valorDiario;

    let textoTiempo = [];
    if (anios > 0) textoTiempo.push(`${anios} año(s)`);
    if (meses > 0) textoTiempo.push(`${meses} mes(es)`);
    if (dias > 0) textoTiempo.push(`${dias} día(s)`);

    document.getElementById('antiguedadText').innerText = textoTiempo.join(', ') || '1 día';
    document.getElementById('periodoText').innerText = 
      `${inicio.toLocaleDateString('es-CL')} al ${termino.toLocaleDateString('es-CL')}`;
    
    document.getElementById('diasHabiles').innerText = diasHabilesAcc.toFixed(2);
    document.getElementById('diasInhabiles').innerText = redondearExcel(diasInhabiles, 2).toFixed(2);
    document.getElementById('diasCorridos').innerText = redondearExcel(fraccionDiasCorridos, 2).toFixed(2);
    document.getElementById('montoDiario').innerText = '$' + Math.round(valorDiario).toLocaleString('es-CL');
    document.getElementById('montoTotal').innerText = '$' + Math.round(totalPagar).toLocaleString('es-CL');

    document.getElementById('resultados').style.display = 'block';
  }
</script>

</body>
</html>
